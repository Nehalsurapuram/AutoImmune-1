apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: order-service-rollout
  namespace: autoimmune-system
  labels:
    app: order-service
spec:
  replicas: 10
  strategy:
    canary:
      canaryService: order-service-canary
      stableService: order-service-stable
      trafficRouting:
        istio:
          virtualService:
            name: order-service-vsvc
            routes:
              - primary
      steps:
        - setWeight: 5
        - pause: { duration: 180s }
        - setWeight: 25
        - pause: { duration: 300s }
        - setWeight: 50
        - pause: { duration: 300s }
      analysis:
        templates:
          - templateName: autoimmune-sli-metrics
        args:
          - name: service-name
            value: order-service
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order-service
          image: autoimmune/order-service:stable
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: autoimmune-sli-metrics
  namespace: autoimmune-system
spec:
  metrics:
    - name: error-rate
      interval: 30s
      successCondition: result[0] <= 0.001
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus.monitoring:9090
          query: |
            sum(rate(http_server_requests_seconds_count{status=~"5.*",app="order-service"}[1m]))
            /
            sum(rate(http_server_requests_seconds_count{app="order-service"}[1m]))
    - name: p95-latency
      interval: 30s
      successCondition: result[0] <= 0.050
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus.monitoring:9090
          query: |
            histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{app="order-service"}[1m])) by (le))
